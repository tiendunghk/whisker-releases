name: Release index

# Publishes release.json (the latest release's version and installers) to
# GitHub Pages, so the landing page can read it without the GitHub API's
# 60-requests-per-hour limit for anonymous visitors.
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build release.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '{
            version: (.tag_name | ltrimstr("v")),
            tag: .tag_name,
            published_at,
            url: .html_url,
            assets: [.assets[] | {name, url: .browser_download_url, size}]
          }' > site/release.json
          cat site/release.json

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
