name: Release index

# Writes release.json (the latest release's version and installers) to the
# `release-index` branch. The landing page reads it from
# raw.githubusercontent.com: HTTPS, CORS-enabled and without the GitHub API's
# 60-requests-per-hour limit for anonymous visitors.
#
# The branch is replaced by a single commit each time, so it never grows.
on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - name: Build release.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '{
            version: (.tag_name | ltrimstr("v")),
            tag: .tag_name,
            published_at,
            url: .html_url,
            assets: [.assets[] | {name, url: .browser_download_url, size}]
          }' > release.json
          cat release.json

      - name: Replace the release-index branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version release.json)
          git init -q index && mv release.json index/ && cd index
          git checkout -q --orphan release-index
          git add release.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Release index for ${version}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release-index
